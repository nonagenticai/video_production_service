<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --midnight:#0B1437;--ink:#1E293B;--muted:#64748B;--border:#E2E8F0;--surface:#F8FAFC;
    --teal:#14B8A6;--teal-dark:#0F766E;--teal-pale:#F0FDFA;
    --coral:#F97316;--coral-dark:#EA580C;--coral-light:#FFEDD5;
    --navy:#4F46E5;--navy-dark:#3730A3;--navy-pale:#EEF2FF;
    --amber:#D97706;--amber-dark:#92400E;--amber-pale:#FEF3C7;
    --violet:#9333EA;--violet-dark:#6B21A8;--violet-pale:#F5F0FF;
    --font-display:'Fraunces',Georgia,serif;--font-sans:'IBM Plex Sans',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:#0a0f24}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;padding:64px 66px 56px}
  .card::before,.card::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;pointer-events:none}
  .card::before{width:520px;height:520px;background:var(--teal);left:-180px;top:-200px}
  .card::after{width:520px;height:520px;background:var(--coral);right:-200px;bottom:-220px}

  .head{position:relative;z-index:2}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-dark)}
  .eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
  h1{font-family:var(--font-display);font-weight:600;font-size:74px;line-height:1.02;letter-spacing:-.02em;color:var(--midnight);margin-top:20px}
  h1 .c{color:var(--coral-dark)}
  h1 .t{color:var(--teal-dark)}

  .flow{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;margin:14px 0 6px}
  .spine{position:absolute;left:34px;top:40px;bottom:40px;width:3px;background:linear-gradient(var(--teal),var(--coral));opacity:.28;border-radius:2px}
  .spine-dot{position:absolute;left:28px;width:15px;height:15px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px rgba(20,184,166,.18);animation:travel 3s linear infinite}
  @keyframes travel{from{top:34px}to{top:calc(100% - 50px)}}

  .row{position:relative;display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:24px;padding:13px 18px 13px 0;border-radius:16px}
  .tile{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--cp);color:var(--cd);position:relative;z-index:2}
  .tile svg{width:34px;height:34px}
  .name{font-family:var(--font-display);font-weight:600;font-size:34px;color:var(--midnight);letter-spacing:-.01em}
  .chip{font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:9px 18px;border-radius:999px;background:var(--cp);color:var(--cd);white-space:nowrap}

  @keyframes rowbg{0%,20%,100%{background:transparent}8%{background:var(--cp)}}
  @keyframes tilep{0%,20%,100%{transform:scale(1);box-shadow:none}8%{transform:scale(1.13);box-shadow:0 0 0 7px var(--cp),0 14px 30px -8px var(--cg)}}
  @keyframes chipf{0%,20%,100%{background:var(--cp);color:var(--cd)}8%{background:var(--c);color:#fff}}
  .row{animation:rowbg 3s ease-in-out infinite}
  .row .tile{animation:tilep 3s ease-in-out infinite}
  .row .chip{animation:chipf 3s ease-in-out infinite}

  .foot{position:relative;z-index:2;border-top:1px solid var(--border);padding-top:26px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .thesis{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:27px;color:var(--midnight);line-height:1.25;max-width:680px}
  .thesis em{font-style:italic;color:var(--coral-dark)}
  .brand{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
  .brand .mark{font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--midnight)}
  .brand .sub{font-size:14px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="eyebrow"><span class="dot"></span><span data-bind="eyebrow"></span></span>
    <h1 data-bind="title"></h1>
  </div>
  <div class="flow">
    <div class="spine"></div>
    <div class="spine-dot"></div>
    <div id="rows"></div>
  </div>
  <div class="foot">
    <p class="thesis" data-bind="thesis"></p>
    <div class="brand"><span class="mark" data-bind="brand_mark"></span><span class="sub" data-bind="brand_sub"></span></div>
  </div>
</div>

<script>
// Palette groups: name -> [accent, pale, dark, glow]
const PAL = {
  teal:  ['#14B8A6','#F0FDFA','#0F766E','rgba(20,184,166,.45)'],
  navy:  ['#4F46E5','#EEF2FF','#3730A3','rgba(79,70,229,.4)'],
  amber: ['#D97706','#FEF3C7','#92400E','rgba(217,119,6,.4)'],
  violet:['#9333EA','#F5F0FF','#6B21A8','rgba(147,51,234,.4)'],
  coral: ['#F97316','#FFEDD5','#EA580C','rgba(249,115,22,.42)'],
};
// A small pool of line icons assigned by row index.
const ICONS = [
  '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 9l2 2-2 2"/><path d="M12 13h4"/><path d="M8 21h8"/>',
  '<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 12l1.6 1.6L14 10"/><path d="M9 17h6"/>',
  '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  '<path d="M12 3l8 3v6c0 4.5-3 7.5-8 9-5-1.5-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.2 2.2L15.5 9.5"/>',
  '<path d="M12 3c3 1 5 4.5 5 8.5L15 16H9l-2-4.5C7 7.5 9 4 12 3z"/><circle cx="12" cy="9.5" r="1.6"/><path d="M9 16l-2 4M15 16l2 4"/>',
];

const DEFAULTS = {
  eyebrow: 'The non-agentic AI system',
  title: 'From <span class="c">Prompt</span> to <span class="t">Production</span>',
  thesis: 'The process holds the agency, <em>not the model.</em>',
  brand_mark: 'nonagentic.ai',
  brand_sub: 'AI, with people in command',
  rows: [
    {name:'Request',    chip:'You describe',   color:'teal'},
    {name:'Readying',   chip:'System prepares',color:'navy'},
    {name:'Doing',      chip:'Process runs',   color:'amber'},
    {name:'Inspecting', chip:'It verifies',    color:'violet'},
    {name:'Approve',    chip:'You decide',     color:'coral'},
    {name:'Publishing', chip:'You ship',       color:'teal'},
  ],
};

const P = Object.assign({}, DEFAULTS, window.PARAMS || {});
document.querySelectorAll('[data-bind]').forEach(el => {
  const v = P[el.getAttribute('data-bind')];
  if (v != null) el.innerHTML = v;
});

const rowsEl = document.getElementById('rows');
const rows = Array.isArray(P.rows) && P.rows.length ? P.rows : DEFAULTS.rows;
const N = rows.length;
rows.forEach((r, i) => {
  const pal = PAL[r.color] || PAL.teal;
  const div = document.createElement('div');
  div.className = 'row';
  div.style.cssText = `--c:${pal[0]};--cp:${pal[1]};--cd:${pal[2]};--cg:${pal[3]}`;
  // Negative-delay phase offsets across the 3s master loop (freeze-capture safe).
  const delay = -(3 - (i / N) * 3).toFixed(3) + 's';
  div.innerHTML =
    `<div class="tile" style="animation-delay:${delay}">` +
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICONS[i % ICONS.length]}</svg></div>` +
    `<div class="name">${r.name}</div>` +
    `<div class="chip" style="animation-delay:${delay}">${r.chip}</div>`;
  div.style.animationDelay = delay;
  rowsEl.appendChild(div);
});

// CSS-driven template: no window.render(); the recorder seeks Animation.currentTime.
// The only JS motion surface is the render duration. Route it through MotionLib so
// the signature timeline total is honored when motion params are present, while a
// params-less render returns exactly LEGACY_TOTAL (3000) — byte-identical to today.
const LEGACY_TOTAL = 3000;
window.RENDER_DURATION_MS = MotionLib.renderDurationMs(P, LEGACY_TOTAL);
</script>
</body>
</html>
