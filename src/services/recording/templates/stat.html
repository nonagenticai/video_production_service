<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0B1437;--bg2:#16205a;--accent:#14B8A6;--accent2:#F97316;
    --text:#F8FAFC;--muted:#94A3B8;
    --font-display:'Fraunces',Georgia,serif;--font-sans:'IBM Plex Sans',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{font-family:var(--font-sans);overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;padding:9%;
    background:radial-gradient(120% 120% at 20% 0%,var(--bg2),var(--bg))}
  .glow{position:absolute;width:56vmin;height:56vmin;border-radius:50%;filter:blur(130px);
    opacity:.22;background:var(--accent2);left:-16vmin;bottom:-18vmin;pointer-events:none;
    will-change:transform,opacity}
  .kicker{font-size:2.2vmin;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
    color:var(--accent);margin-bottom:3vmin;will-change:transform,opacity}
  .number{font-family:var(--font-display);font-weight:600;line-height:.92;letter-spacing:-.03em;
    color:var(--accent2);display:flex;align-items:baseline;justify-content:center;
    will-change:transform,opacity}
  .number .value{font-size:26vmin}
  .number .suffix{font-size:12vmin;margin-left:1vmin;color:var(--accent)}
  .label{font-size:3vmin;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-top:3.2vmin;max-width:22em;line-height:1.2;
    will-change:transform,opacity}
  [data-anim]{opacity:0}
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <span class="kicker" id="kicker" data-anim></span>
  <div class="number" id="number" data-anim><span class="value" id="value"></span><span class="suffix" id="suffix"></span></div>
  <div class="label" id="label" data-anim></div>
</div>
<script>
const DEFAULTS = {
  kicker:'',
  stat:null, value:'', suffix:'', label:'',
  bg:'#0B1437', bg2:'#16205a', accent:'#14B8A6', accent2:'#F97316',
  text:'#F8FAFC', muted:'#94A3B8',
};
const P = Object.assign({}, DEFAULTS, window.PARAMS || {});
MotionLib.applyBrandVars(P);

// Prefer nested P.stat, fall back to flat P.value/P.suffix/P.label, then a demo default.
const stat = (P.stat && typeof P.stat === 'object') ? P.stat : {};
const value  = stat.value  != null && stat.value  !== '' ? stat.value  : (P.value  ?? '');
const suffix = stat.suffix != null ? stat.suffix : (P.suffix != null ? P.suffix : '%');
const label  = stat.label  != null && stat.label  !== '' ? stat.label  : (P.label  ?? '');

// textContent — never innerHTML — for user-supplied strings.
document.getElementById('value').textContent = String(value);
const suffixEl = document.getElementById('suffix');
if (suffix) suffixEl.textContent = String(suffix); else suffixEl.style.display = 'none';
document.getElementById('label').textContent = String(label);

const kickerEl = document.getElementById('kicker');
if (P.kicker) kickerEl.textContent = P.kicker; else kickerEl.style.display = 'none';

// Ordered staggered elements (present-only): kicker?, big number, label.
const seq = [];
if (P.kicker) seq.push({el:kickerEl, travel:14});
seq.push({el:document.getElementById('number'), travel:34});
seq.push({el:document.getElementById('label'), travel:20});

const FALLBACK_MS = 3800, BASE = 80, DUR = 760;
const T = MotionLib.timing(P, seq.length, FALLBACK_MS);
window.RENDER_DURATION_MS = MotionLib.renderDurationMs(P, FALLBACK_MS);

const glowEl = document.querySelector('.glow');
window.render = function(t){
  MotionLib.glow(glowEl, t, T);
  seq.forEach((s,i)=> MotionLib.layer(s.el, t, {start:T.marks[i]+BASE, dur:DUR, travel:s.travel, T}));
};
window.render(0);
</script>
</body>
</html>
