<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  two_beat — a two-beat opening title: a headline, then an emphasised second
  beat that lands on its own mark, beside the film's dial motif.

  PARAMS (window.PARAMS; all optional, strings unless noted)
    kicker       ""      small caps line above the headline (hidden when empty)
    title        ""      beat 0 — the headline (fits to <= 3 lines)
    emphasis     ""      beat 1 — the emphasised line, accent colour + drawn underline
                         (fits to <= 2 lines; hidden when empty)
    motif        "dial"  "dial" | "none" — the drawn dial on the right
    icon         ""      a glyph name from _icons.js drawn at the dial's centre, inside
                         its inner rings (unknown/empty -> no glyph; never drawn
                         without the dial). It enters with the headline on beat 0
                         and breathes with the dial — the card's picture, so a
                         headline is never type on a ring alone.
    duration_ms  6000    number, clip length; pass the record request's value
    marks        —       number[2] ms: [title, emphasis]. Beat 0 is pinned to 0.
                         Absent: [0, min(1800, duration/2)].
    film_t_ms    0       number, this card's start on the film clock (ambient continuity)
    caption_safe true    keep the layout above video_compiler's burned-in caption
                         band (bottom 18% of the frame; derivation with compiler
                         file:line in _motion_lib.js CAPTION); false = full frame
    easing, stagger_ms, glow_drift — see _motion_lib.js (film kit)
    bg, bg2, accent, accent2, text, muted, font_display, font_sans — brand tokens
  Continuous motion after the last entrance: the dial arc keeps being nudged, its
  inner rings rotate, and a glint travels the underline.
-->
<style>
  :root{
    --bg:#0B1437;--bg2:#16205a;--accent:#14B8A6;--accent2:#F97316;
    --text:#F8FAFC;--muted:#94A3B8;
    --font-display:'Inter','IBM Plex Sans',-apple-system,sans-serif;
    --font-sans:'Inter','IBM Plex Sans',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;align-items:center;
    padding:calc(var(--u)*5) calc(var(--u)*7)}
  .copy{position:relative;width:calc(var(--u)*58);max-width:100%}
  .fk{margin-bottom:calc(var(--u)*2.2)}
  h1{font-family:var(--font-display);font-weight:700;font-size:calc(var(--u)*6.8);line-height:1.06;
    letter-spacing:-.03em;color:var(--text);text-wrap:balance}
  .emph{display:inline-block;position:relative;margin-top:calc(var(--u)*1.3);max-width:100%;
    font-family:var(--font-display);font-weight:700;font-size:calc(var(--u)*6.8);line-height:1.06;
    letter-spacing:-.03em;color:var(--accent);padding-bottom:calc(var(--u)*1.5)}
  .ul{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*.55);border-radius:calc(var(--u)*.4);
    background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left center;overflow:hidden}
  .ul i{position:absolute;top:0;bottom:0;width:18%;left:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
  .orbit{position:absolute;width:calc(var(--u)*48);height:calc(var(--u)*48);
    right:calc(var(--u)*-11);top:50%;margin-top:calc(var(--u)*-24)}
  .og{position:absolute;width:calc(var(--u)*48);height:calc(var(--u)*48);
    right:calc(var(--u)*-11);top:50%;margin-top:calc(var(--u)*-24);
    display:flex;align-items:center;justify-content:center;pointer-events:none}
  .og .gl{width:26%;height:26%;display:flex}
  body.no-motif .copy{width:calc(var(--u)*86)}
  @media (max-aspect-ratio:1/1){
    .stage{align-items:flex-end;padding-bottom:calc(var(--u)*12)}
    .copy{width:100%}
    .orbit,.og{right:calc(var(--u)*-6);top:calc(var(--u)*6);margin-top:0}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="orbit" id="orbit"></div>
  <div class="og" id="og"><div class="gl" id="glyph"></div></div>
  <div class="copy">
    <div class="fk" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="emph" id="emph"><span id="emphText"></span><div class="ul" id="ul"><i id="glint"></i></div></div>
  </div>
</div>
<script>
const DEFAULTS = {
  // No built-in copy: a caller that omits content gets an empty card.
  kicker:'', title:'', emphasis:'', motif:'dial', icon:'',
  bg:'#0B1437', bg2:'#16205a', accent:'#14B8A6', accent2:'#F97316',
  text:'#F8FAFC', muted:'#94A3B8',
};
const P = Object.assign({}, DEFAULTS, window.PARAMS || {});
MotionLib.applyBrandVars(P);
const F = MotionLib.film(P, {beats: 2, fallbackMs: 6000});
window.RENDER_DURATION_MS = F.dur;

const $ = (id) => document.getElementById(id);
const kickerEl = $('kicker'), titleEl = $('title'), emphEl = $('emph');
// textContent — never innerHTML — for caller strings.
if (P.kicker) kickerEl.textContent = String(P.kicker); else kickerEl.style.display = 'none';
titleEl.textContent = String(P.title || '');
if (P.emphasis) $('emphText').textContent = String(P.emphasis); else emphEl.style.display = 'none';
const orbitEl = $('orbit');
const hasMotif = P.motif !== 'none';
if (!hasMotif){ orbitEl.style.display = 'none'; document.body.classList.add('no-motif'); }
// The glyph: looked up by NAME in window.ICONS (iconSvg returns '' for an unknown
// one), so a caller string never reaches the markup.
const ICON = hasMotif ? String(P.icon || '') : '';
const glyphHost = $('og'), glyphEl = $('glyph');
const hasGlyph = !!(ICON && window.ICONS && window.ICONS[ICON]);
if (hasGlyph) glyphEl.innerHTML = iconSvg(ICON, {size: '100%', color: 'var(--text)', strokeWidth: 1.5});
else glyphHost.style.display = 'none';

F.ready(function(){
  MotionLib.fit(titleEl, 3, 0.6);
  MotionLib.fit(emphEl, 2, 0.6);
});

window.render = function(t){
  F.ambient(t);
  F.enter(kickerEl, t, 0, {dur: 420, travel: 1});
  F.enter(titleEl, t, 0, {dur: 560, travel: 2.2});
  // Beat 1: the emphasised line rises in, its underline wipes on, then a glint
  // keeps travelling it.
  F.enter(emphEl, t, 1, {dur: 640, travel: 2.6});
  $('ul').style.transform = 'scaleX(' + F.p(t, 1, 700, 260) + ')';
  $('glint').style.left = (-20 + 140 * F.loop(t, 2600)) + '%';
  if (hasMotif){
    // The dial's frame is there from the first frame; its arc draws on beat 1.
    orbitEl.style.opacity = 0.35 + 0.65 * F.p(t, 0, 500);
    MotionLib.orbit(orbitEl, t, F.p(t, 1, 1100, 120));
  }
  if (hasGlyph){
    // Beat 0: the glyph settles in with the headline; then it breathes with the dial.
    const g = F.p(t, 0, 640, 120);
    const breathe = 1 + 0.035 * Math.sin(2 * Math.PI * F.loop(t, 3200));
    glyphHost.style.opacity = g.toFixed(4);
    glyphEl.style.transform = 'scale(' + ((0.82 + 0.18 * g) * breathe).toFixed(4) + ')';
  }
};
window.render(0);
</script>
</body>
</html>
